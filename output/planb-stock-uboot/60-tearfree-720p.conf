# 60-tearfree.conf — TearFree + 720p60 cho RK3128 HDMI
Section "Device"
    Identifier "modeset"
    Driver "modesetting"
    Option "TearFree" "true"
EndSection

Section "Monitor"
    Identifier "HDMI-A-1"
    Option "PreferredMode" "1280x720"
    Option "ModeDebug" "false"
EndSection

Section "Screen"
    Identifier "Screen 0"
    Monitor "HDMI-A-1"
    Device "modeset"
    DefaultDepth 16
EndSection
